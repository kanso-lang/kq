name: ci
on:
  pull_request:
  push:
    branches: [main]
  # A pull request that produces no run at all reads exactly like one whose
  # checks passed. vse hit that on 2026-08-15 — three events that should each
  # have scheduled a run produced nothing, and closing and reopening the PR
  # was the only lever available, which did not work either. This is the lever
  # that would have.
  workflow_dispatch:
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Pinned, not floating. kq used to build against kanso main, so a
      # compiler regression arrived inside whatever kq PR happened to run
      # next and read as that PR's doing — which is how carry_dedup's rise
      # came to be explained as a kq change. A kq PR is now tested against a
      # fixed compiler, so its failures are its own, and moving the pin is
      # its own PR whose diff is the compiler and nothing else. Catching a
      # compiler regression is kanso's job, in kanso's CI.
      - name: build the pinned kanso toolchain
        run: |
          git clone https://github.com/kanso-lang/kanso /tmp/kanso
          cd /tmp/kanso && git checkout "$(cat $GITHUB_WORKSPACE/.kanso-version)"
          cargo build --release
      - name: jq (the oracle)
        run: sudo apt-get install -y jq
      - name: specs (unit + fixture goldens + jq byte-identity)
        run: KANSO=/tmp/kanso/target/release/kanso sh spec.sh
      # The vein the allocator counters cannot reach. Both quadratics behind
      # the 147 ms row allocated nothing new, so every gate above this line
      # stayed green across a 3.7x change in the published number.
      - name: valgrind (callgrind counts, it does not sample)
        run: sudo apt-get install -y valgrind
      - name: how much work kq does
        run: sh bench/instructions.sh

  # The README's wall-clock and hardware-counter tables are a dated sitting on
  # a quiet box, moved by hand, and gated by bench/numbers_gate so they
  # cannot outlive the compiler they describe. This is the other half: the
  # allocator counters are deterministic to the byte on any machine, so they
  # are regenerated here and committed, and are never stale by an oversight.
  publish:
    name: the measured numbers, verified
    # This job used to regenerate the numbers and push a bot commit onto the
    # PR branch. A commit pushed with the default token schedules no
    # workflows, and the pushed commit became the PR head, so the status
    # rollup read a SHA with no runs and a fully verified PR showed zero
    # checks — indistinguishable from one whose CI never started (kq PR 61).
    # The counters are deterministic, so the fix is the same discipline as
    # every other golden in the project: the author commits the numbers, CI
    # regenerates and refuses a mismatch. The referee does not write the
    # score.
    needs: spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build the pinned kanso toolchain
        run: |
          git clone https://github.com/kanso-lang/kanso /tmp/kanso
          cd /tmp/kanso && git checkout "$(cat $GITHUB_WORKSPACE/.kanso-version)"
          cargo build --release
      # publish_numbers runs the built binary under KANSO_COUNTERS and needs
      # the 2.1 MB fixture, which the scale gate writes. The counters are
      # exact on any machine; the wall-clock table stays what this file
      # always said it was, a dated sitting on a quiet box moved by hand.
      - name: build kq and the scaled fixture
        run: |
          export KANSO=/tmp/kanso/target/release/kanso
          "$KANSO" build "$(pwd)" --release
          "$KANSO" run bench/scale_gate
      - name: regenerate bench/MEASURED.md
        run: |
          export KANSO=/tmp/kanso/target/release/kanso
          "$KANSO" run bench/publish_numbers
      - name: refuse a mismatch
        run: |
          if ! git diff --exit-code -- bench/MEASURED.md README.md; then
            echo "the committed numbers do not match this code."
            echo "regenerate and commit them with the change that moved them:"
            echo "  kanso run bench/scale_gate && kanso run bench/publish_numbers"
            exit 1
          fi
